[project]
name = "training-backend"
version = "0.1.0"
description = "培训考试平台 后端"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "cryptography>=42.0",
    "email-validator>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# 规约集：保留与项目现有风格相容的子集，避免一次性引入过多噪声
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes（未用导入/未定义名等）
    "W",    # pycodestyle warnings
    "I",    # isort（导入顺序）
    "UP",   # pyupgrade（如 Union→X|Y）
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
# 项目历史代码存在已知的 E712（== True 比较，SQLAlchemy ORM 必需）等，
# 先不把这类全部 fail，等渐进治理；这里仅忽略少量既有模式
# B008：FastAPI 路由参数默认值用 Depends(...) 是官方惯用法，属框架必需，忽略
ignore = ["E501", "B008"]  # E501 行长由 formatter 统一；B008 FastAPI Depends 默认值

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "E702", "B011"]  # 测试：后置 import、紧凑分号语句、assert False 守卫均为惯用法

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# 渐进式接入：当前仅做"能跑通、不阻断"的宽松检查，后续可逐步收紧
warn_unused_ignores = false
check_untyped_defs = false
