name: frontend-ci

# 前端质量门禁：格式化 / 静态检查 / 类型检查 / 单元测试 / 构建。
#
# 背景：本仓库此前只有镜像构建 workflow，`npm run lint` 因扁平配置下仍传 `--ext`
# 而直接报错退出，Prettier 也没有任何脚本或 CI 入口，格式与类型问题全靠人工发现。
# 这里与 backend-ci.yml 对齐，把前端纳入与后端同等的门禁。
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format check (prettier)
        run: npm run format:check

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check (vue-tsc)
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

      - name: Build
        run: npm run build
